<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <!-- FreeCat Geometric Symbol -->
  <g transform="translate(4, 6)">
    <!-- Outer Shield / Network Node Glow -->
    <rect width="52" height="52" rx="14" fill="#111C35" />
    <!-- Gradient accent border -->
    <rect x="1" y="1" width="50" height="50" rx="13" stroke="url(#logo_grad)" stroke-width="2" />
    <!-- Geometric Cat Ears & Nodes -->
    <path d="M14 36 L14 20 L22 28 L30 28 L38 20 L38 36 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M14 20 L18 13 L24 22" stroke="#315CFD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M38 20 L34 13 L28 22" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Node Dot -->
    <circle cx="26" cy="32" r="3.5" fill="#315CFD" />
    <circle cx="26" cy="32" r="1.5" fill="#FFFFFF" />
    <!-- Signal pulse lines -->
    <circle cx="18" cy="13" r="2" fill="#315CFD" />
    <circle cx="34" cy="13" r="2" fill="#14B8A6" />
  </g>
  
  <!-- Text Brandmark -->
  <text x="68" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="20" font-weight="800" fill="#111C35" letter-spacing="-0.02em">
    自由猫 <tspan fill="#315CFD" font-weight="700">FreeCat</tspan>
  </text>
  <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="11" font-weight="600" fill="#475467" letter-spacing="0.1em">
    CONNECTIVITY SERVICE PORTAL
  </text>
  <rect x="236" y="20" width="38" height="16" rx="4" fill="#E8EDFB" />
  <text x="255" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#315CFD">
    .SBS
  </text>

  <defs>
    <linearGradient id="logo_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315CFD" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
</svg>
