<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111C35" />
  
  <!-- Subtle Grid & Glow -->
  <defs>
    <radialGradient id="og_glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#315CFD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#111C35" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og_cyan_glow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#111C35" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og_line_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#315CFD" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#D3AC72" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og_glow)" />
  <rect width="1200" height="630" fill="url(#og_cyan_glow)" />

  <!-- Top Decorative Line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#og_line_grad)" />

  <!-- Brand Symbol Large -->
  <g transform="translate(100, 140)">
    <rect width="100" height="100" rx="26" fill="#1E293B" stroke="#315CFD" stroke-width="3" />
    <path d="M28 66 L28 36 L42 50 L58 50 L72 36 L72 66 Z" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M28 36 L36 22 L46 38" stroke="#60A5FA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M72 36 L64 22 L54 38" stroke="#2DD4BF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="58" r="6" fill="#60A5FA" />
    <circle cx="50" cy="58" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Tag -->
  <rect x="230" y="150" width="220" height="36" rx="8" fill="#1E3A8A" fill-opacity="0.6" stroke="#315CFD" stroke-width="1.5" />
  <text x="340" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="0.1em">
    ULTIMATE BRAND 旗舰门户
  </text>

  <!-- Main Headline -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">
    自由猫 FreeCat 旗舰服务门户
  </text>
  
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="28" font-weight="600" fill="#315CFD">
    把复杂的连接问题，整理成简单的答案
  </text>

  <text x="100" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    系统代理设置 · 设备接入指南 · 流量诊断 · 网络质量解析 · 常见故障排除
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="65" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Windows 11</text>
    
    <rect x="145" y="0" width="110" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="200" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">macOS</text>

    <rect x="270" y="0" width="110" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="325" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Android</text>

    <rect x="395" y="0" width="125" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="457" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">iPhone / iOS</text>

    <rect x="535" y="0" width="100" height="42" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="585" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Linux</text>
  </g>

  <!-- URL watermark -->
  <text x="1100" y="590" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#64748B">
    https://freecatcloud.sbs
  </text>
</svg>
